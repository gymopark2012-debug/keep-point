<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDF 뷰어 · KeepPoint</title>
    <link rel="stylesheet" href="./pdf-viewer.css" />
  </head>
  <body>
    <header class="pv-header">
      <button type="button" id="backBtn" class="btn ghost">← 목록</button>
      <div class="pv-title-wrap">
        <h1 id="docTitle">PDF</h1>
        <a id="sourceLink" href="#" target="_blank" rel="noreferrer" class="pv-source">원본 PDF 링크</a>
      </div>
    </header>

    <div class="pv-toolbar">
      <button type="button" id="prevPage" class="btn">이전 페이지</button>
      <span id="pageLabel" class="pv-page">1 / ?</span>
      <button type="button" id="nextPage" class="btn">다음 페이지</button>
      <span class="pv-toolbar-divider"></span>
      <button type="button" id="toolPen" class="btn tool-btn active" data-tool="pen">형광펜</button>
      <button type="button" id="toolMemo" class="btn tool-btn ghost" data-tool="memo">메모</button>
      <button type="button" id="deleteAllBtn" class="btn danger ghost">전체 삭제</button>
    </div>

    <div id="pdfScroll" class="pv-scroll">
      <div id="pdfStage" class="pv-stage">
        <canvas id="pdfCanvas"></canvas>
        <div id="annotationLayer" class="pv-annotation-layer"></div>
        <svg id="annotationSvg" class="pv-annotation-svg"></svg>
      </div>
    </div>

    <aside id="memoPanel" class="pv-memo-panel hidden">
      <h3>메모</h3>
      <textarea id="memoEditor" rows="6" placeholder="메모를 입력하면 자동으로 저장됩니다."></textarea>
      <div class="pv-memo-actions">
        <button type="button" id="memoDeleteBtn" class="btn danger ghost hidden">메모 삭제</button>
        <button type="button" id="memoCloseBtn" class="btn">닫기</button>
      </div>
    </aside>

    <div id="annPopup" class="pv-ann-popup hidden" role="menu">
      <p id="annPopupNote" class="pv-ann-popup-note hidden"></p>
      <div class="pv-ann-popup-row">
        <button type="button" id="annPopupMemo" class="btn" role="menuitem">메모 추가</button>
        <button type="button" id="annPopupDelete" class="pv-icon-btn" role="menuitem" title="삭제" aria-label="삭제">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6l-1 14H6L5 6"></path>
            <path d="M10 11v6"></path>
            <path d="M14 11v6"></path>
            <path d="M9 6V4h6v2"></path>
          </svg>
        </button>
      </div>
    </div>

    <div id="undoToast" class="pv-toast hidden" role="status">
      <span id="undoToastMsg"></span>
      <button type="button" id="undoToastBtn" class="pv-toast-undo">실행 취소</button>
    </div>

    <p id="pdfError" class="pv-error hidden"></p>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="./pdf-viewer.js"></script>
  </body>
</html>
